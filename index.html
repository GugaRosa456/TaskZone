<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskZone · Minhas tarefas</title>
<link rel="stylesheet" href="style(1).css">
</head>
<body>
<header><strong><span class="brand">✓</span> TaskZone</strong><div id="account"><span id="identity"></span><button id="login" hidden>Entrar com Google</button><button id="logout" hidden>Sair</button></div></header>
<main>
<section class="heading"><div><p id="today"></p><h1>Minhas tarefas</h1></div><button id="add" class="primary">＋ Nova tarefa</button></section>
<p id="sync" role="status"></p>
<div id="migration" hidden><span id="migrationText"></span> <button id="migrate">Copiar para minha conta</button></div>
<nav aria-label="Filtrar tarefas"><button data-filter="open" aria-pressed="true">Abertas</button><button data-filter="done" aria-pressed="false">Concluídas</button><button data-filter="archive" aria-pressed="false">Arquivo</button></nav>
<section id="list" aria-label="Lista de tarefas"></section>
<footer><button id="export">Exportar backup</button><button id="import">Importar backup</button><input hidden type="file" accept=".json,application/json" id="file"></footer>
<p id="notice" role="alert"></p>
</main>
<dialog id="editor"><form id="form"><h2 id="dialogTitle">Nova tarefa</h2>
<label>Tarefa<input id="name" required maxlength="500" autofocus></label>
<label>Descrição<textarea id="description" rows="3"></textarea></label>
<label>Prazo<input type="date" id="due"></label>
<div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary" id="save">Salvar</button></div></form></dialog>
<script type="module" src="script.js"></script>
</body></html>
